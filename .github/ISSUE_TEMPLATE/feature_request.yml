name: 功能建议
description: 提议一个新功能或改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: 解决什么问题
      description: 描述你的使用场景和痛点
    validations:
      required: true
  - type: textarea
    attributes:
      label: 建议的方案
      description: 大概怎么实现？涉及哪个视图/包（packages/mimir 或 packages/ui-mimir）？
  - type: textarea
    attributes:
      label: 验收标准
      description: 怎样算做完了？（可测试、可截图验证的条件）
